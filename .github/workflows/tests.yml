name: Tests and wheel installation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --extra dev
      - run: uv run --frozen --extra dev python -m ruff check .
      - run: uv run --frozen --extra dev python -m pytest
      - run: uv build
      - name: Check artifacts and run isolated wheel
        run: uv run --frozen --extra dev python scripts/check_wheel.py --work-dir "${{ runner.temp }}/scifigbench-wheel-check"
      - uses: actions/upload-artifact@v4
        with:
          name: distributions-${{ matrix.os }}-${{ matrix.python }}
          path: dist/
