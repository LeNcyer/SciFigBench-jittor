[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "scifigbench-toolkit"
version = "0.1.0"
description = "Evaluation and rendering tools for scientific figure understanding"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "SciFigBench authors"}]
dependencies = [
  "Pillow>=10.1,<13",
  "numpy>=1.24,<3",
  "scipy>=1.10,<2",
  "jsonschema>=4.18,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "build>=1.2,<2", "ruff>=0.11,<1"]

[project.scripts]
scifigbench = "scifigbench.cli:main"

[project.urls]
Repository = "https://github.com/LeNcyer/SciFigBench-toolkit"
Issues = "https://github.com/LeNcyer/SciFigBench-toolkit/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
scifigbench = ["schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
